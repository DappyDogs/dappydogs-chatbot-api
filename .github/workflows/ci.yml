name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format, lint, types and tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Create virtual environment
        run: python -m venv .venv

      - name: Install project and development dependencies
        run: .venv/bin/python -m pip install --editable ".[dev]"

      - name: Check formatting
        run: .venv/bin/python -m ruff format --check src tests

      - name: Run linters
        run: .venv/bin/python -m ruff check src tests

      - name: Run static type checks
        run: .venv/bin/python -m mypy

      - name: Run tests
        run: .venv/bin/python -m pytest
